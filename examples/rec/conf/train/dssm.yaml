# torch-rechub examples/matching/run_ml_dssm.py: embed 16, towers [256,128,64]
# PReLU, Adam lr 1e-4 weight_decay 1e-6, batch 4096, 10 epochs, seed 2022.
# Reported reference (examples/matching/README.md): Hit@100 = Recall@100 = 14.74%.
name: dssm
task: two_tower
seed: 2022
batch_size: 4096
eval_batch_size: 4096
epochs: 10
eval_every: 1
select_metric: hit@100
topk: [10, 50, 100]
log_every: 0
output_dir: ${experiment.exp_dir}/checkpoint

model:
  model_type: dssm
  torch_dtype: fp32
  embedding_dim: 16
  tower_hidden: [256, 128, 64]
  activation: prelu
  dropout: 0.0
  # torch-rechub passes temperature=0.02 but DSSM.forward does not apply it.
  temperature: 1.0

data:
  path: /flagos-rec/datasets/movielens_1m_dssm
  num_workers: 2
  max_samples: null
  eval_max_samples: null

optimizer:
  lr: 1.0e-4
  weight_decay: 1.0e-6
