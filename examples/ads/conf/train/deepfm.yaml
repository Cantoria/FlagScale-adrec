# BARS DeepFM_criteo_x1 (FuxiCTR v1.1.0, model_id DeepFM_criteo_x1_001_4b788fed):
# reported test AUC 0.813666 / logloss 0.438147 (5-run mean AUC 0.813812). See examples/ads/EVIDENCE.md.
name: deepfm
seed: 2021
batch_size: 4096
eval_batch_size: 65536
epochs: 100
early_stop_patience: 2
monitor: AUC
log_every: 0
output_dir: ${experiment.exp_dir}/checkpoint

model:
  model_type: deepfm
  torch_dtype: fp32
  embedding_dim: 10
  hidden_units: [400, 400, 400]
  hidden_activations: relu
  net_dropout: 0.1
  batch_norm: true

data:
  path: /flagos-ads/datasets/criteo_x1
  valid_split: valid
  group_key: null
  num_workers: 2
  max_samples: null
  eval_max_samples: null

optimizer:
  lr: 1.0e-3
  embedding_regularizer: 1.0e-5
  max_gradient_norm: 10.0
